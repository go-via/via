# Usage: ansible-playbook -i <ip>, playbook.yml   (trailing comma = ad-hoc inventory)
- name: Deploy go-via.dev
  hosts: all
  become: true
  vars:
    domain: go-via.dev
    bind: 127.0.0.1:8080
    bin: /usr/local/bin/go-via-site
    env_file: /etc/go-via.env
    build_dir: "{{ playbook_dir }}/.."
    go_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"

  tasks:
    - name: Refuse a non-Debian target
      ansible.builtin.assert:
        that: ansible_os_family == 'Debian'
        fail_msg: "this playbook installs Debian packages; {{ ansible_os_family }} is not supported"

    - name: Make the local build directory
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ build_dir }}/.build"
        state: directory
        mode: "0755"

    - name: Build the binary locally
      delegate_to: localhost
      become: false
      environment: { CGO_ENABLED: "0", GOOS: linux, GOARCH: "{{ go_arch }}" }
      ansible.builtin.command:
        cmd: >-
          go build -trimpath
          -ldflags "-s -w -X main.version={{ lookup('pipe', 'git rev-parse --short HEAD') }}"
          -o .build/site-{{ go_arch }} .
        chdir: "{{ build_dir }}"
      changed_when: false

    - name: Add the Caddy apt repository
      ansible.builtin.deb822_repository:
        name: caddy-stable
        types: [deb]
        uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
        suites: [any-version]
        components: [main]
        signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        state: present
        enabled: true

    - name: Install caddy
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: true

    - name: Install the binary
      ansible.builtin.copy:
        src: "{{ build_dir }}/.build/site-{{ go_arch }}"
        dest: "{{ bin }}"
        mode: "0755"
      notify: Restart go-via

    # force:false because rotating the key logs every session out.
    - name: Mint the session key
      ansible.builtin.copy:
        content: "VIA_SESSION_KEY={{ lookup('password', '/dev/null chars=hexdigits length=64') }}\n"
        dest: "{{ env_file }}"
        owner: root
        group: root
        mode: "0600"
        force: false
      no_log: true

    - name: Install the systemd unit
      ansible.builtin.template:
        src: templates/go-via.service.j2
        dest: /etc/systemd/system/go-via.service
        mode: "0644"
      notify: Restart go-via

    - name: Install the Caddyfile
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        mode: "0644"
      notify: Reload caddy

    - name: Enable the services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: [go-via, caddy]

    # Handlers run at the end of the play, so the health check would otherwise
    # probe the old binary.
    - name: Apply pending restarts before probing
      ansible.builtin.meta: flush_handlers

    - name: Wait for the deployed site to answer
      ansible.builtin.uri:
        url: "https://{{ domain }}/healthz"
        return_content: true
      register: healthz
      until: healthz.status == 200
      retries: 10
      delay: 3

  handlers:
    - name: Restart go-via
      ansible.builtin.systemd_service:
        name: go-via
        state: restarted
        daemon_reload: true
    - name: Reload caddy
      ansible.builtin.systemd_service:
        name: caddy
        state: reloaded
