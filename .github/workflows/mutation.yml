name: Mutation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gomutants --changed-since needs the base branch's history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum

      - name: Mutate changed lines
        run: bash ./mutation.sh "origin/${{ github.base_ref }}"
