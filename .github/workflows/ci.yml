name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    # Tests read README.md and other docs, so no docs-only skip, and no
    # `paths`/`paths-ignore` trigger filter: that would leave this required
    # check pending forever on a docs-only PR.
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Build/scan with the latest stable toolchain; go.mod keeps the
          # compatibility floor. Pinning the runner to the floor's .0 patch
          # made govulncheck fail on already-patched stdlib vulns.
          go-version: stable
          cache: true

      - name: Run CI checks
        # --no-browser because the tier has its own job below; hosted runners
        # ship Chrome, so ci.sh would otherwise run it a second time uncached.
        run: bash ./ci.sh --no-browser

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          (cd vtbrowser && govulncheck -tags browser ./...)
          (cd internal/site && govulncheck ./...)

  browser-test:
    name: Browser Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: vtbrowser/go.sum

      - name: Install Chromium
        # ubuntu-latest runners ship Google Chrome preinstalled; install
        # Chromium only when no browser is present so the job stays fast
        # on hosted runners but still works on bare self-hosted ones. The
        # pick goes to VIA_CHROME so the tests run the binary checked here.
        run: |
          find_chrome() {
            for c in chromium chromium-browser chrome google-chrome google-chrome-stable headless-shell; do
              if command -v "$c" >/dev/null 2>&1; then
                command -v "$c"
                return 0
              fi
            done
            return 1
          }
          if ! chrome=$(find_chrome); then
            sudo apt-get update
            sudo apt-get install -y chromium-browser
            # Fail loudly here rather than letting the tier skip or flake later.
            chrome=$(find_chrome) || { echo "no browser binary after install" >&2; exit 1; }
          fi
          echo "using $chrome"
          echo "VIA_CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Run browser tier (vtbrowser, -tags browser)
        run: cd vtbrowser && go test -race -tags browser ./...
