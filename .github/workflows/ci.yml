name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly on go-version: stable, so a new Go release that breaks a tool
  # (go1.27.2 vs staticcheck v0.8.1) fails here, not on someone's PR.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  build-test:
    # Tests read README.md and other docs, so no docs-only skip, and no
    # `paths`/`paths-ignore` trigger filter: that would leave this required
    # check pending forever on a docs-only PR.
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Build/scan with the latest stable toolchain; go.mod keeps the
          # compatibility floor. Pinning the runner to the floor's .0 patch
          # made govulncheck fail on already-patched stdlib vulns.
          go-version: stable
          cache: true
          cache-dependency-path: |
            go.sum
            internal/site/go.sum
            vtbrowser/go.sum

      - name: Run CI checks
        # ubuntu-latest ships Chrome on PATH, which ci.sh's browser tier needs.
        # Installing one is the runner's job, not this workflow's.
        run: bash ./ci.sh
